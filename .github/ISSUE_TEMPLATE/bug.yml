name: Anomalie
description: Signaler un comportement incorrect reproductible
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes: { label: Description, description: Comportement observé et impact métier }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Étapes, données et rôle utilisateur }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Résultat attendu }
    validations: { required: true }
  - type: dropdown
    id: environment
    attributes: { label: Environnement, options: [Local, Development, Test, Production] }
    validations: { required: true }
