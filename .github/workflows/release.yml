name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run validate
      - name: Vérifier la cohérence du tag et de la version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Générer le SBOM CycloneDX
        run: npm sbom --sbom-format cyclonedx > sflight-cap-sbom.cdx.json
      - name: Installer Cloud MTA Build Tool
        run: npm install --global mbt
      - name: Construire le MTAR
        run: mbt build
      - name: Attester la provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: mta_archives/*.mtar
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mta_archives/*.mtar
            sflight-cap-sbom.cdx.json
