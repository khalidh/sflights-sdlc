name: Deploy SAP BTP

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible protégé par GitHub Environments
        type: choice
        options: [development, test, production]
        required: true
      tag:
        description: Tag Git à déployer (ex. v1.2.0)
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global mbt
      - run: mbt build
      - name: Installer Cloud Foundry CLI et plugin MultiApps
        run: |
          wget -q -O cf-cli.tgz "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=8"
          tar -xzf cf-cli.tgz
          sudo install -m 0755 cf8 /usr/local/bin/cf
          cf install-plugin -r CF-Community "multiapps" -f
      - name: Se connecter et déployer
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf api "$CF_API"
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o "$CF_ORG" -s "$CF_SPACE"
          cf deploy mta_archives/*.mtar -f
          cf apps
