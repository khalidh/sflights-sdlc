_schema-version: "3.3"
ID: sflight-cap
version: 1.0.0
description: Application SAP CAP SFLIGHT

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: sflight-cap-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 128M
      disk-quota: 256M
    build-parameters:
      builder: npm-ci
    requires:
      - name: sflight-cap-auth
      - name: sflight-cap-html5-runtime
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  - name: sflight-cap-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: sflight-cap-db
      - name: sflight-cap-auth

  - name: sflight-cap-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: sflight-cap-db

  - name: sflight-cap-content
    type: com.sap.application.content
    path: .
    requires:
      - name: sflight-cap-html5-repo
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: sflight-travel-ui
          artifacts:
            - sflight-travel-ui.zip
          target-path: resources/

  - name: sflight-travel-ui
    type: html5
    path: app/travel
    build-parameters:
      builder: custom
      build-result: dist
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

resources:
  - name: sflight-cap-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: sflight-cap-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
  - name: sflight-cap-html5-repo
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: sflight-cap-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
